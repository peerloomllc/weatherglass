# The iPhone app. Generate the Xcode project on the Mac with:
#   cd ios && xcodegen
name: Weatherglass
options:
  bundleIdPrefix: com.peerloom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: G79ALD29NA
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  Weatherglass:
    type: application
    platform: iOS
    sources:
      - Weatherglass
      - Shared
      # The Android app's skin pictures, used as they are.
      - path: ../app/src/main/res/drawable-nodpi
        name: SkinArt
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peerloom.weatherglass
        INFOPLIST_KEY_CFBundleDisplayName: Weatherglass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Weatherglass uses your approximate location to show the weather where you are."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Weatherglass/Weatherglass.entitlements
    info:
      path: Weatherglass/Info.plist
      properties:
        # The About page checks for a Lightning wallet before offering to open one.
        LSApplicationQueriesSchemes: [lightning]
    dependencies:
      - target: WeatherglassWidgets
  WeatherglassWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peerloom.weatherglass.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Weatherglass
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
